<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070a08" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Chiptune" />
    <title>Chiptune</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="row">
          <button id="play" type="button" aria-pressed="false">Play</button>
          <label class="bpm" for="bpm">
            BPM
            <output id="bpm-out" for="bpm">120</output>
            <input id="bpm" type="range" min="40" max="300" step="1" value="120" />
          </label>
          <span class="lbl">PAT</span>
          <output id="pat">01</output>
          <span class="lbl">LEN</span>
          <div class="group" role="group" aria-label="Pattern length">
            <button type="button" data-steps="16">16</button>
            <button type="button" data-steps="32">32</button>
            <button type="button" data-steps="48">48</button>
            <button type="button" data-steps="64">64</button>
          </div>
          <button id="prev" type="button" aria-label="Previous steps">Prev</button>
          <output id="head">00</output>
          <button id="next" type="button" aria-label="Next steps">Next</button>
          <button id="undo" type="button">Undo</button>
          <button id="redo" type="button">Redo</button>
          <button id="copy" type="button">Copy</button>
          <button id="paste" type="button">Paste</button>
        </div>
        <div class="row">
          <div class="group" role="group" aria-label="Tool">
            <button id="tool-draw" type="button" aria-pressed="true">Draw</button>
            <button id="tool-erase" type="button" aria-pressed="false">Erase</button>
            <button id="tool-select" type="button" aria-pressed="false">Select</button>
          </div>
          <label class="vol" for="vol">
            VOL
            <output id="vol-out" for="vol">F</output>
            <input id="vol" type="range" min="0" max="15" step="1" value="15" />
          </label>
          <span class="lbl">DRUM</span>
          <div class="group" role="group" aria-label="Drums">
            <button type="button" data-drum="0">Kick</button>
            <button type="button" data-drum="1">Snare</button>
            <button type="button" data-drum="2">Hat</button>
            <button type="button" data-drum="3">Short</button>
            <button type="button" data-drum="4">Long</button>
          </div>
          <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
          <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
          <button id="fit" type="button">Fit</button>
        </div>
        <div class="row tools" id="arrange">
          <div class="group" role="group" aria-label="Playback">
            <button id="mode-pat" type="button">Pat</button>
            <button id="mode-song" type="button">Song</button>
          </div>
          <div id="pats" class="group" role="group" aria-label="Patterns"></div>
          <button id="pat-new" type="button">New</button>
          <button id="pat-dup" type="button" aria-label="Duplicate pattern">Dup</button>
          <div id="lane" role="group" aria-label="Song lane"></div>
          <button id="rep-dec" type="button" aria-label="Fewer repeats">R−</button>
          <output id="rep-out">1</output>
          <button id="rep-inc" type="button" aria-label="More repeats">R+</button>
          <button id="tr-dec" type="button" aria-label="Transpose entry down">T−</button>
          <output id="tr-out">+0</output>
          <button id="tr-inc" type="button" aria-label="Transpose entry up">T+</button>
          <button id="mark" type="button">Mark</button>
          <button id="loop-in" type="button" aria-label="Loop start">[</button>
          <button id="loop-out" type="button" aria-label="Loop end">]</button>
          <button id="loop-all" type="button">All</button>
          <button id="hear" type="button">Hear</button>
        </div>
        <div class="row tools" id="craft">
          <div class="group" role="group" aria-label="Scale">
            <button type="button" data-scale="0">Chr</button>
            <button type="button" data-scale="1">Maj</button>
            <button type="button" data-scale="2">Min</button>
            <button type="button" data-scale="3">Pent</button>
            <button type="button" data-scale="4">Cust</button>
          </div>
          <button id="root-dec" type="button" aria-label="Root down">−</button>
          <output id="root-out">C</output>
          <button id="root-inc" type="button" aria-label="Root up">+</button>
          <div id="pcs" class="group" role="group" aria-label="Custom scale" hidden></div>
          <label class="swing" for="swing">
            SW
            <output id="swing-out" for="swing">50</output>
            <input id="swing" type="range" min="50" max="75" step="1" value="50" />
          </label>
          <button id="quantize" type="button">Qnt</button>
          <button id="onion" type="button">Onion</button>
          <button id="rec" type="button">Rec</button>
          <output id="iso">---</output>
          <button id="arp-apply" type="button">Arp</button>
          <button id="mut-rand" type="button">Rnd</button>
          <button id="mut-hum" type="button">Hum</button>
          <button id="mut-var" type="button">Var</button>
          <button id="mut-fill" type="button">Fill</button>
          <button id="edit-down" type="button" aria-label="Transpose down">−1</button>
          <button id="edit-up" type="button" aria-label="Transpose up">+1</button>
          <button id="edit-dup" type="button" aria-label="Duplicate notes">x2</button>
          <button id="edit-left" type="button" aria-label="Offset left">Of−</button>
          <button id="edit-right" type="button" aria-label="Offset right">Of+</button>
        </div>
      </header>
      <div id="views">
        <div id="grid-wrap">
          <canvas id="grid" aria-label="Step grid"></canvas>
        </div>
        <div id="roll-wrap">
          <canvas id="roll" aria-label="Piano roll"></canvas>
        </div>
      </div>
      <aside id="inspector" aria-label="Instrument inspector">
        <div id="channels" role="group" aria-label="Channel">
          <button type="button" data-channel="0"><span class="led" data-led="0"></span>P1</button>
          <button type="button" data-channel="1"><span class="led" data-led="1"></span>P2</button>
          <button type="button" data-channel="2"><span class="led" data-led="2"></span>TRI</button>
          <button type="button" data-channel="3"><span class="led" data-led="3"></span>NSE</button>
        </div>
        <div id="presets" role="group" aria-label="Presets">
          <button type="button" data-preset="0">Lead</button>
          <button type="button" data-preset="1">Bass</button>
          <button type="button" data-preset="2">Arp</button>
          <button type="button" data-preset="3">Kick</button>
          <button type="button" data-preset="4">Snare</button>
          <button type="button" data-preset="5">Hat</button>
        </div>
        <canvas id="scope" aria-label="Oscilloscope"></canvas>
        <div id="knobs">
          <div class="knob" data-knob="vol"><button id="knob-vol" type="button" aria-label="Channel volume"></button><span>VOL</span><output id="out-vol">100</output></div>
          <div class="knob" data-knob="pan"><button id="knob-pan" type="button" aria-label="Pan"></button><span>PAN</span><output id="out-pan">C</output></div>
          <div class="knob" data-knob="sweep"><button id="knob-sweep" type="button" aria-label="Pulse sweep"></button><span>SWP</span><output id="out-sweep">0</output></div>
          <div class="knob" data-knob="attack"><button id="knob-attack" type="button" aria-label="Attack"></button><span>ATK</span><output id="out-attack">4</output></div>
          <div class="knob" data-knob="decay"><button id="knob-decay" type="button" aria-label="Decay"></button><span>DEC</span><output id="out-decay">80</output></div>
          <div class="knob" data-knob="sustain"><button id="knob-sustain" type="button" aria-label="Sustain"></button><span>SUS</span><output id="out-sustain">100</output></div>
          <div class="knob" data-knob="release"><button id="knob-release" type="button" aria-label="Release"></button><span>REL</span><output id="out-release">20</output></div>
          <div class="knob" data-knob="vib"><button id="knob-vib" type="button" aria-label="Vibrato depth"></button><span>VIB</span><output id="out-vib">0</output></div>
          <div class="knob" data-knob="rate"><button id="knob-rate" type="button" aria-label="Vibrato rate"></button><span>RATE</span><output id="out-rate">5</output></div>
          <div class="knob" data-knob="slide"><button id="knob-slide" type="button" aria-label="Pitch slide"></button><span>SLD</span><output id="out-slide">0</output></div>
          <div class="knob" data-knob="arp"><button id="knob-arp" type="button" aria-label="Arpeggio rate"></button><span>ARP</span><output id="out-arp">0</output></div>
        </div>
        <canvas id="env" aria-label="Envelope"></canvas>
        <div id="duty-row" role="group" aria-label="Duty cycle">
          <button type="button" data-duty="0">12.5</button>
          <button type="button" data-duty="1">25</button>
          <button type="button" data-duty="2">50</button>
          <button type="button" data-duty="3">75</button>
        </div>
        <div id="arp-row" role="group" aria-label="Arpeggio">
          <button type="button" data-arp="0">Off</button>
          <button type="button" data-arp="1">Up</button>
          <button type="button" data-arp="2">Down</button>
          <button type="button" data-arp="3">UpDn</button>
          <button type="button" data-arp="4">Rand</button>
        </div>
        <canvas id="wave" aria-label="Wavetable"></canvas>
        <div id="lfsr-row" role="group" aria-label="Noise register">
          <button id="lfsr-long" type="button" aria-label="Long noise">Long</button>
          <button id="lfsr-short" type="button" aria-label="Short noise">Short</button>
        </div>
        <div class="lbl">STEP</div>
        <output id="step-out">00</output>
        <div class="lbl">NOTE</div>
        <div class="spin">
          <button id="note-dec" type="button" aria-label="Lower note">−</button>
          <output id="note-out">---</output>
          <button id="note-inc" type="button" aria-label="Raise note">+</button>
        </div>
        <div class="lbl">LEN</div>
        <div class="spin">
          <button id="len-dec" type="button" aria-label="Shorter note">−</button>
          <output id="len-out">01</output>
          <button id="len-inc" type="button" aria-label="Longer note">+</button>
        </div>
        <div class="lbl">VOL</div>
        <div class="spin">
          <button id="vol-dec" type="button" aria-label="Quieter">−</button>
          <output id="vol-read">0F</output>
          <button id="vol-inc" type="button" aria-label="Louder">+</button>
        </div>
        <div class="lbl">PITCH</div>
        <div class="spin">
          <button id="pitch-dec" type="button" aria-label="Lower pitch">−</button>
          <output id="pitch-out">+0</output>
          <button id="pitch-inc" type="button" aria-label="Raise pitch">+</button>
        </div>
        <div id="step-duty-label" class="lbl">STEP DUTY</div>
        <div id="step-duty" role="group" aria-label="Step duty">
          <button type="button" data-step-duty="255">CH</button>
          <button type="button" data-step-duty="0">12</button>
          <button type="button" data-step-duty="1">25</button>
          <button type="button" data-step-duty="2">50</button>
          <button type="button" data-step-duty="3">75</button>
        </div>
        <div id="step-arp-label" class="lbl">STEP ARP</div>
        <div id="step-arp" role="group" aria-label="Step arpeggio">
          <button type="button" data-step-arp="255">CH</button>
          <button type="button" data-step-arp="0">Off</button>
          <button type="button" data-step-arp="1">Up</button>
          <button type="button" data-step-arp="2">Dn</button>
          <button type="button" data-step-arp="3">UD</button>
          <button type="button" data-step-arp="4">Rnd</button>
        </div>
      </aside>
      <section id="mixer" aria-label="Mixer">
        <div class="strip" data-channel="0">
          <span><span class="led" data-led="0"></span>P1</span>
          <button type="button" data-mute="0" aria-label="Mute P1">Mute</button>
          <button type="button" data-solo="0" aria-label="Solo P1">Solo</button>
        </div>
        <div class="strip" data-channel="1">
          <span><span class="led" data-led="1"></span>P2</span>
          <button type="button" data-mute="1" aria-label="Mute P2">Mute</button>
          <button type="button" data-solo="1" aria-label="Solo P2">Solo</button>
        </div>
        <div class="strip" data-channel="2">
          <span><span class="led" data-led="2"></span>TRI</span>
          <button type="button" data-mute="2" aria-label="Mute triangle">Mute</button>
          <button type="button" data-solo="2" aria-label="Solo triangle">Solo</button>
        </div>
        <div class="strip" data-channel="3">
          <span><span class="led" data-led="3"></span>NSE</span>
          <button type="button" data-mute="3" aria-label="Mute noise">Mute</button>
          <button type="button" data-solo="3" aria-label="Solo noise">Solo</button>
        </div>
      </section>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
